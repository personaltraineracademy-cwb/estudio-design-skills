<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo E · Modal de captura com dialog</title>
<meta name="description" content="Teste: dialog nativo com transição de entrada/saída, formulário curto, máscara de WhatsApp, estados (erro, enviando, sucesso).">
<!--
  PADRÃO: o botão é um <a href> que leva ao grupo (funciona sem JS). Com JS, vira "abrir <dialog>".
  <dialog> modal: foco preso, ESC fecha, ::backdrop, inert no resto — de graça.
  Transição de entrada/saída: @starting-style + transition: overlay/display allow-discrete (Chrome 117+, Safari 17.4+, Firefox 129+).
  Sem suporte a isso: abre/fecha sem animação (continua funcionando).
  Estados: pronto → inválido (erro inline + aria-invalid) → enviando (botão com texto "Enviando…", não clica 2x) → sucesso (aria-live).
  DEMO: o envio é simulado (setTimeout) — troque por fetch() para o destino real.
-->
<style>
@font-face{font-family:"Big Shoulders";src:url(../fonts/bigshoulders-900.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Archivo";src:url(../fonts/archivo-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Archivo";src:url(../fonts/archivo-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Azeret Mono";src:url(../fonts/azeretmono-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--ink:#0E0E10;--ink2:#17140F;--gold:#E2B04A;--paper:#ECE7DC;--line:rgba(236,231,220,.22);--err:#FF6B57;--ok:#7BE0A4;--ease:cubic-bezier(.4,.14,.3,1);--pad:clamp(20px,5vw,64px);
 --f-d:"Big Shoulders",Impact,sans-serif;--f-t:"Archivo",system-ui,sans-serif;--f-m:"Azeret Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--paper);font:400 clamp(1.0625rem,1rem + .4vw,1.25rem)/1.5 var(--f-t);min-height:100svh;overflow-x:clip}
.pg{padding:clamp(56px,10vw,120px) var(--pad);max-width:1280px;margin:0 auto}
.eyebrow{font:500 .8125rem/1.4 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font:900 clamp(3.25rem,13vw,8rem)/1 var(--f-d);text-transform:uppercase;margin-top:12px;max-width:12ch;text-wrap:balance}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;margin-top:28px;background:var(--gold);color:var(--ink);border:0;border-radius:10px;font:700 1rem/1 var(--f-t);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(205,168,94,.25)}
.cta:active{transform:translateY(0);box-shadow:none}
.cta:focus-visible,.btn-x:focus-visible,input:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
/* ---------- dialog ---------- */
dialog{border:0;padding:0;background:var(--ink2);color:var(--paper);width:min(520px,calc(100vw - 24px));max-height:calc(100svh - 24px);overflow:auto;
  border:1px solid var(--line);border-radius:16px;margin:auto;
  opacity:0;transform:translateY(24px) scale(.98);
  transition:opacity .28s var(--ease),transform .28s var(--ease),overlay .28s allow-discrete,display .28s allow-discrete}
dialog[open]{opacity:1;transform:none}
@starting-style{dialog[open]{opacity:0;transform:translateY(24px) scale(.98)}}
dialog::backdrop{background:rgba(5,4,3,0);backdrop-filter:blur(0);transition:background .28s var(--ease),backdrop-filter .28s var(--ease),overlay .28s allow-discrete,display .28s allow-discrete}
dialog[open]::backdrop{background:rgba(5,4,3,.78);backdrop-filter:blur(6px)}
@starting-style{dialog[open]::backdrop{background:rgba(5,4,3,0);backdrop-filter:blur(0)}}
@media (max-width:520px){
  dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:16px 16px 0 0;max-height:92svh;transform:translateY(100%)}
  @starting-style{dialog[open]{transform:translateY(100%)}}
}
.in{padding:clamp(20px,4vw,32px)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hd h2{font:900 clamp(2rem,7vw,3rem)/1 var(--f-d);text-transform:uppercase}
.btn-x{flex:none;width:48px;height:48px;border:1.5px solid var(--line);background:transparent;color:var(--paper);border-radius:10px;font-size:1.5rem;line-height:1;cursor:pointer}
.sub{margin-top:8px;color:#CFC9BD;font-size:1rem}
form{margin-top:20px;display:grid;gap:16px}
label{display:grid;gap:6px;font:700 .9375rem/1.3 var(--f-t)}
input[type=text],input[type=tel]{height:56px;padding:0 16px;background:var(--ink);color:var(--paper);border:1.5px solid rgba(236,231,220,.5);border-radius:10px;font:400 1.125rem/1 var(--f-t)}
input[aria-invalid=true]{border-color:var(--err)}
.err{font:500 .875rem/1.4 var(--f-t);color:var(--err);min-height:0;display:none}
input[aria-invalid=true]~.err{display:block}
.ck{display:flex;gap:12px;align-items:flex-start;font:400 .9375rem/1.45 var(--f-t);color:#CFC9BD}
.ck input{width:24px;height:24px;margin-top:2px;accent-color:var(--gold);flex:none}
.go{min-height:56px;border:0;border-radius:10px;background:var(--gold);color:var(--ink);font:700 1rem/1 var(--f-t);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;position:relative}
.go[disabled]{cursor:progress;opacity:.8}
.go[disabled]::after{content:"";position:absolute;right:16px;top:50%;width:18px;height:18px;margin-top:-9px;border:2.5px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(1turn)}}
.ok{display:none;text-align:left}
.ok .mk{width:64px;height:64px;border:2px solid var(--ok);border-radius:50%;display:grid;place-items:center;margin-bottom:16px}
.ok .mk svg{width:32px;height:32px;stroke:var(--ok);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.is-ok .ok .mk svg{animation:tick .5s var(--ease) .1s forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.ok h2{font:900 clamp(2.25rem,8vw,3.25rem)/1 var(--f-d);text-transform:uppercase}
.ok p{margin-top:8px;color:#CFC9BD}
.is-ok form,.is-ok .sub,.is-ok .hd,.is-ok #e-ok{display:none}
.is-ok .ok{display:block}
@media (prefers-reduced-motion:reduce){
  dialog,dialog::backdrop{transition-duration:.01s}
  .go[disabled]::after{animation-duration:2s}
  .is-ok .ok .mk svg{animation:none;stroke-dashoffset:0}
}
</style>
</head>
<body>
<main class="pg">
  <p class="eyebrow">Grupo fechado</p>
  <h1>Entre antes da transmissão.</h1>
  <a class="cta" id="abrir" href="https://chat.whatsapp.com/DEMO-sem-destino-real">Entrar no grupo</a>
</main>

<dialog id="dlg" aria-labelledby="dlg-t" aria-describedby="dlg-d">
  <div class="in" id="corpo">
    <div class="hd"><h2 id="dlg-t">Entrar no grupo</h2><button class="btn-x" type="button" id="fechar" aria-label="Fechar">×</button></div>
    <p class="sub" id="dlg-d">Dois campos. Você recebe o link da transmissão no WhatsApp.</p>
    <form id="f" novalidate>
      <label>Seu nome
        <input type="text" name="nome" autocomplete="name" required aria-describedby="e-nome">
        <span class="err" id="e-nome">Escreva seu nome.</span>
      </label>
      <label>WhatsApp com DDD
        <input type="tel" name="zap" inputmode="numeric" autocomplete="tel-national" placeholder="(11) 91234-5678" required aria-describedby="e-zap">
        <span class="err" id="e-zap">Confira o DDD e o número (11 dígitos).</span>
      </label>
      <label class="ck"><input type="checkbox" name="ok" required> <span>Aceito receber avisos desta transmissão por WhatsApp.</span></label>
      <span class="err" id="e-ok" style="margin-top:-8px">Marque para continuar.</span>
      <button class="go" type="submit" id="go">Entrar no grupo</button>
    </form>
    <div class="ok" role="status" aria-live="polite" id="ok">
      <div class="mk"><svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Você está dentro.</h2>
      <p>Falta um passo: abrir o grupo e fixar a conversa.</p>
      <a class="cta" id="grupo" href="https://chat.whatsapp.com/DEMO-sem-destino-real">Abrir o grupo</a>
    </div>
  </div>
</dialog>

<script>
(function () {
  var dlg = document.getElementById("dlg"), abrir = document.getElementById("abrir"), f = document.getElementById("f"),
      corpo = document.getElementById("corpo"), go = document.getElementById("go"), eok = document.getElementById("e-ok");
  if (!dlg.showModal) return;                       // sem <dialog>: o link continua levando ao grupo
  var last;
  abrir.addEventListener("click", function (e) { e.preventDefault(); last = document.activeElement; corpo.classList.remove("is-ok"); dlg.showModal(); f.nome.focus(); });
  document.getElementById("fechar").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });   // clicar no fundo fecha
  dlg.addEventListener("close", function () { if (last) last.focus(); });

  f.zap.addEventListener("input", function () {     // máscara (11) 91234-5678
    var d = this.value.replace(/\D/g, "").slice(0, 11), s = d;
    if (d.length > 6) s = "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    else if (d.length > 2) s = "(" + d.slice(0, 2) + ") " + d.slice(2);
    else if (d.length) s = "(" + d;
    this.value = s;
  });
  function marca(el, bad) { el.setAttribute("aria-invalid", bad); }
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var nomeBad = f.nome.value.trim().length < 2, zapBad = f.zap.value.replace(/\D/g, "").length !== 11, okBad = !f.ok.checked;
    marca(f.nome, nomeBad); marca(f.zap, zapBad); eok.style.display = okBad ? "block" : "none";
    var primeiro = nomeBad ? f.nome : zapBad ? f.zap : okBad ? f.ok : null;
    if (primeiro) { primeiro.focus(); return; }
    go.disabled = true; go.textContent = "Enviando…";
    setTimeout(function () {                        // DEMO: troque por fetch(destino)
      go.disabled = false; go.textContent = "Entrar no grupo";
      corpo.classList.add("is-ok");
      document.getElementById("grupo").focus();
    }, 900);
  });
})();
</script>
</body>
</html>
