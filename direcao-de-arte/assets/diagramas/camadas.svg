<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 460' width='560' height='460' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='560' height='460' fill='#F6F5F1'/><text x='40' y='44' font-size='18' font-weight='700' fill='#1A1A1A' text-anchor='start'>Pilha de camadas de uma peça</text><rect x='40' y='70' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='56' y='92' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>7 acabamento</text><rect x='46' y='114' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='62' y='136' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>6 texto e logo (sempre nítidos)</text><rect x='52' y='158' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='68' y='180' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>5 tarjas</text><rect x='58' y='202' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='74' y='224' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>4 frente</text><rect x='64' y='246' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='80' y='268' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>3 sujeito (foto recortada)</text><rect x='70' y='290' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='86' y='312' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>2 atrás (palavra atrás da pessoa)</text><rect x='76' y='334' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='92' y='356' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>1 textura / grão</text><rect x='82' y='378' width='420' height='34' rx='6' fill='#FFFFFF' stroke='#1