<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 840 345' width='840' height='345' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='840' height='345' fill='#F6F5F1'/><text x='40' y='44' font-size='18' font-weight='700' fill='#1A1A1A' text-anchor='start'>Escala de raios (arte 1080 px)  ·  site = arte ÷ 2,75</text><rect x='40' y='80' width='120' height='120' rx='0' fill='#1A1A1A' stroke='#1A1A1A' stroke-width='2' opacity='1'/><text x='100' y='230' font-size='16' font-weight='700' fill='#1A1A1A' text-anchor='middle'>0</text><text x='100' y='250' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='middle'>sinal / destaque</text><rect x='200' y='80' width='120' height='120' rx='16' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='2' opacity='1'/><text x='260' y='230' font-size='16' font-weight='700' fill='#1A1A1A' text-anchor='middle'>16</text><text x='260' y='250' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='middle'>chip, rótulo</text><rect x='360' y='80' width='120' height='120' rx='28' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='2' opacity='1'/><text x='420' y='230' font-size='16' font-weight='700' fill='#1A1A1A' text-anchor='middle'>28</text><text x='420' y='250' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='middle'>cartão, foto</text><rect x='520' y='80' width='120' height='120' rx='44' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='2' opacity='1'/><text x='580' y='230' font-size='16' font-weight='700' fill='#1A1A1A' text-anchor='middle'>44</text><text x='580' y='250' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='middle'>painel grande</text><rect x='680' y='112' width='120' height='56' rx='28' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='2' opacity='1'/><text x='740' y='230' font-size='16' font-weight='700' fill='#1A1A1A' text-anchor='middle'>pílula</text><text x='740' y='250' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='middle'>botão, tag</text><text x='40' y='300' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>O reto é o sinal, a curva é a escola: elementos levemente arredondados por padrão;</text><text x='40' y='320' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>canto reto só como destaque com função. O logo nunca arredonda sem pedido.</text></svg>
