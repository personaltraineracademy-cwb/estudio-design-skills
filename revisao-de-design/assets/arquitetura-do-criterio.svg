<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 790 400' width='790' height='400' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='790' height='400' fill='#F6F5F1'/><defs><marker id='s' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#1A1A1A'/></marker><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#3D5AFE'/></marker></defs><text x='30' y='38' font-size='18' font-weight='700' fill='#1A1A1A' text-anchor='start'>Sistema de critério do estúdio</text><text x='30' y='60' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='start'>3 camadas, usadas igual por todas as skills, em 3 momentos</text><rect x='30' y='80' width='230' height='150' rx='12' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='46' y='106' font-size='14' font-weight='700' fill='#3D5AFE' text-anchor='start'>1 · REGRA</text><text x='46' y='124' font-size='11' font-weight='400' fill='#8A8A85' text-anchor='start'>o que é bom, em palavras</text><circle cx='52' cy='146' r='3' fill='#1A1A1A'/><text x='62' y='150' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>régua: 8 critérios 0–4</text><circle cx='52' cy='168' r='3' fill='#1A1A1A'/><text x='62' y='172' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>gosto: aprovado / reprovado</text><rect x='280' y='80' width='230' height='150' rx='12' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='296' y='106' font-size='14' font-weight='700' fill='#3D5AFE' text-anchor='start'>2 · EXEMPLOS</text><text x='296' y='124' font-size='11' font-weight='400' fill='#8A8A85' text-anchor='start'>como é o bom, em casos</text><circle cx='302' cy='146' r='3' fill='#1A1A1A'/><text x='312' y='150' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>calibração: aprovados com nota</text><circle cx='302' cy='168' r='3' fill='#1A1A1A'/><text x='312' y='172' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>repertório: referências públicas</text><circle cx='302' cy='190' r='3' fill='#1A1A1A'/><text x='312' y='194' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>padrões por área</text><rect x='530' y='80' width='230' height='150' rx='12' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='546' y='106' font-size='14' font-weight='700' fill='#3D5AFE' text-anchor='start'>3 · PROVA</text><text x='546' y='124' font-size='11' font-weight='400' fill='#8A8A85' text-anchor='start'>isto está bom mesmo?</text><circle cx='552' cy='146' r='3' fill='#1A1A1A'/><text x='562' y='150' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>portão técnico (scripts)</text><circle cx='552' cy='168' r='3' fill='#1A1A1A'/><text x='562' y='172' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>comparar com exemplos</text><circle cx='552' cy='190' r='3' fill='#1A1A1A'/><text x='562' y='194' font-size='12' font-weight='400' fill='#1A1A1A' text-anchor='start'>2ª opinião · arena p/ escolher</text><rect x='30' y='262' width='230' height='74' rx='12' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><text x='46' y='288' font-size='12' font-weight='700' fill='#F6F5F1' text-anchor='start'>ANTES DE CRIAR</text><text x='46' y='308' font-size='11' font-weight='400' fill='#F6F5F1' text-anchor='start'>definir alvo: piso, alvo,</text><text x='46' y='323' font-size='11' font-weight='400' fill='#F6F5F1' text-anchor='start'>princípios, o que não repetir</text><path d='M262 299 h16' stroke='#1A1A1A' stroke-width='2' marker-end='url(#s)'/><rect x='280' y='262' width='230' height='74' rx='12' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><text x='296' y='288' font-size='12' font-weight='700' fill='#F6F5F1' text-anchor='start'>DEPOIS DE CRIAR</text><text x='296' y='308' font-size='11' font-weight='400' fill='#F6F5F1' text-anchor='start'>portão → régua calibrada → olho →</text><text x='296' y='323' font-size='11' font-weight='400' fill='#F6F5F1' text-anchor='start'>decisão (máx. 2 rodadas)</text><path d='M512 299 h16' stroke='#1A1A1A' stroke-width='2' marker-end='url(#s)'/><rect x='530' y='262' width='230' height='74' rx='12' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><text x='546' y='288' font-size='12' font-weight='700' fill='#F6F5F1' text-anchor='start'>DEPOIS DA APROVAÇÃO</text><text x='546' y='308' font-size='11' font-weight='400' fill='#F6F5F1' text-anchor='start'>o aprovado vira exemplo; correção</text><text x='546' y='323' font-size='11' font-weight='400' fill='#F6F5F1' text-anchor='start'>vira regra</text><path d='M645 338 v26 H145 v-26' fill='none' stroke='#3D5AFE' stroke-width='2' stroke-dasharray='5 4' marker-end='url(#a)'/><text x='395' y='382' font-size='11' font-weight='400' fill='#3D5AFE' text-anchor='middle'>o sistema cresce: cada aprovação vira exemplo para a próxima criação</text></svg>
