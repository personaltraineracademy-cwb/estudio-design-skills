<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 520' width='760' height='520' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='760' height='520' fill='#F6F5F1'/><text x='40' y='40' font-size='18' font-weight='700' fill='#1A1A1A' text-anchor='start'>1ª dobra padrão = tela inteira</text><rect x='40' y='70' width='195' height='422' rx='18' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><rect x='52' y='84' width='50' height='12' rx='2' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><rect x='173' y='82' width='50' height='16' rx='8' fill='none' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='58' y='94' font-size='8' font-weight='700' fill='#F6F5F1' text-anchor='start'>LOGO</text><rect x='52' y='148' width='171' height='120' rx='10' fill='#D5D3CC' stroke='none' stroke-width='1.5' opacity='1'/><text x='137.5' y='212' font-size='11' font-weight='400' fill='#8A8A85' text-anchor='middle'>imagem</text><rect x='62.5' y='284' width='150' height='14' rx='2' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><rect x='57.5' y='306' width='160' height='14' rx='2' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><rect x='82.5' y='328' width='110' height='14' rx='2' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><rect x='67.5' y='358' width='140' height='8' rx='2' fill='#8A8A85' stroke='none' stroke-width='1.5' opacity='1'/><rect x='52' y='390' width='171' height='28' rx='14' fill='#3D5AFE' stroke='none' stroke-width='1.5' opacity='1'/><text x='137.5' y='408' font-size='10' font-weight='700' fill='#FFFFFF' text-anchor='middle'>botão (1 linha)</text><rect x='92.5' y='430' width='90' height='6' rx='2' fill='#D5D3CC' stroke='none' stroke-width='1.5' opacity='1'/><text x='40' y='514' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='start'>celular 390 × 844</text><rect x='280' y='70' width='432' height='270' rx='8' fill='#FFFFFF' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><rect x='296' y='84' width='56' height='12' rx='2' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><rect x='634' y='81' width='62' height='18' rx='9' fill='none' stroke='#1A1A1A' stroke-width='1.5' opacity='1'/><text x='302' y='94' font-size='8' font-weight='700' fill='#F6F5F1' text-anchor='start'>LOGO</text><rect x='406.0' y='112' width='180' height='96' rx='10' fill='#D5D3CC' stroke='none' stroke-width='1.5' opacity='1'/><text x='496.0' y='164' font-size='11' font-weight='400' fill='#8A8A85' text-anchor='middle'>imagem</text><rect x='386.0' y='222' width='220' height='15' rx='2' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><rect x='406.0' y='244' width='180' height='15' rx='2' fill='#1A1A1A' stroke='none' stroke-width='1.5' opacity='1'/><rect x='416.0' y='270' width='160' height='7' rx='2' fill='#8A8A85' stroke='none' stroke-width='1.5' opacity='1'/><rect x='436.0' y='290' width='120' height='24' rx='12' fill='#3D5AFE' stroke='none' stroke-width='1.5' opacity='1'/><text x='280' y='362' font-size='12' font-weight='400' fill='#8A8A85' text-anchor='start'>desktop 1440 × 900: mesma composição, só a escala muda</text><text x='280' y='380' font-size='13' font-weight='400' fill='#1A1A1A' text-anchor='start'>Ordem: imagem → título → apoio → botão → micro, num eixo só.</text><text x='280' y='402' font-size='13' font-weight='400' fill='#8A8A85' text-anchor='start'>Logo UMA vez (cabeçalho). Sem eyebrow, selos ou faixa na 1ª tela.</text><text x='280' y='424' font-size='13' font-weight='400' fill='#8A8A85' text-anchor='start'>A seção seguinte não aparece. Conteúdo centrado na altura.</text><text x='280' y='446' font-size='13' font-weight='400' fill='#8A8A85' text-anchor='start'>≥ 38–50% de área vazia. Botão com rótulo em 1 linha até 360 px.</text></svg>
